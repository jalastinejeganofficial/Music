name: Build & Package Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-packages
          - os: ubuntu-latest
            artifact_name: Music-Linux-x64.tar.gz
          - os: macos-latest
            artifact_name: Music-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pillow

      # --- WINDOWS BUILD & PACKAGE MANAGER ---
      - name: Build Windows Executables, MSI & Package Manager
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean Music.spec
          python packaging/windows/create_portable_zip.py
          pyinstaller --noconfirm --clean --onefile --noconsole --name MusicSetup --icon assets/icon.ico --add-data "assets;assets" packaging/windows/installer_app.py
          python packaging/windows/build_msi.py
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/windows/Music_Installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" packaging/windows/Music_Installer.iss
          }

      # --- LINUX BUILD ---
      - name: Install Linux System Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-0 python3-gi gir1.2-webkit2-4.1

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean Music.spec
          mkdir -p dist
          tar -czvf dist/Music-Linux-x64.tar.gz -C dist Music

      # --- MACOS BUILD ---
      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean \
            --windowed \
            --name="Music" \
            --icon="assets/icon.png" \
            --add-data="static:static" \
            --add-data="assets:assets" \
            desktop_app.py
          cd dist
          zip -r Music-macOS.zip Music.app

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Music-Windows-x64
          path: |
            dist/Music-Windows-x64.zip
            dist/Music.msi
            dist/MusicSetup.exe
            dist/Music-Setup-x64.exe

      - name: Upload Linux/macOS Artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.msi
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
