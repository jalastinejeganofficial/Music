name: Build & Package Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Music-Windows-x64.zip
            asset_name: Music-Windows-x64.zip
          - os: ubuntu-latest
            artifact_name: Music-Linux-x64.tar.gz
            asset_name: Music-Linux-x64.tar.gz
          - os: macos-latest
            artifact_name: Music-macOS.zip
            asset_name: Music-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pillow

      # --- WINDOWS BUILD ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean Music.spec
          python packaging/windows/create_portable_zip.py

      # --- LINUX BUILD ---
      - name: Install Linux System Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-0 python3-gi gir1.2-webkit2-4.1

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean Music.spec
          mkdir -p dist
          tar -czvf dist/Music-Linux-x64.tar.gz -C dist Music

      # --- MACOS BUILD ---
      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean \
            --windowed \
            --name="Music" \
            --icon="assets/icon.png" \
            --add-data="static:static" \
            --add-data="assets:assets" \
            desktop_app.py
          cd dist
          zip -r Music-macOS.zip Music.app

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
